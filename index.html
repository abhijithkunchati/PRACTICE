<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>LP Mapping Trainer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e7e9ee;
    --muted: #939aab;
    --accent: #ff9900;
    --ok: #3ecf8e;
    --no: #ff6b6b;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 8px) env(safe-area-inset-left);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 40px; }

  /* ---- header ---- */
  header {
    display: flex; align-items: baseline; gap: 10px;
    flex-wrap: wrap; margin-bottom: 14px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .tools { margin-left: auto; display: flex; gap: 6px; }
  .tool {
    background: none; border: 1px solid var(--line); color: var(--muted);
    font-size: 12px; padding: 6px 10px; border-radius: 99px; cursor: pointer;
  }
  .tool:active { background: var(--panel-2); }

  /* ---- scoreboard ---- */
  .score-row {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .stat {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 10px; min-width: 0;
  }
  .stat b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat i {
    font-style: normal; font-size: 10px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted);
  }

  /* ---- question card ---- */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }
  .meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px; font-size: 11px; color: var(--muted);
  }
  .badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line);
  }
  .badge.qb { color: var(--ok); border-color: rgba(62,207,142,.35); }
  .badge.gen { color: var(--accent); border-color: rgba(255,153,0,.35); }
  #remaining { margin-left: auto; font-variant-numeric: tabular-nums; }
  #question { font-size: 17px; line-height: 1.45; margin: 0; }

  /* ---- options ---- */
  #options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 12px; font-size: 14px; line-height: 1.25;
    cursor: pointer; min-height: 52px; transition: background .12s, border-color .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:active:not(:disabled) { background: var(--panel-2); }
  .opt:disabled { cursor: default; }
  .opt .key {
    flex: none; width: 20px; height: 20px; border-radius: 5px;
    background: var(--panel-2); color: var(--muted);
    font-size: 11px; display: grid; place-items: center;
  }
  .opt.right { border-color: var(--ok); background: rgba(62,207,142,.12); }
  .opt.right .key { background: var(--ok); color: #0b2019; }
  .opt.wrong { border-color: var(--no); background: rgba(255,107,107,.12); }
  .opt.wrong .key { background: var(--no); color: #2a0d0d; }
  .opt.dim { opacity: .35; }

  /* ---- verdict ---- */
  #verdict {
    margin-top: 14px; background: var(--panel); border: 1px solid var(--line);
    border-left-width: 3px; border-radius: var(--radius); padding: 14px;
  }
  .v-head { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .v-head.ok { color: var(--ok); }
  .v-head.no { color: var(--no); }
  .v-head .answer { color: var(--text); font-size: 16px; }
  #verdict .def { margin: 0 0 10px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  #verdict .cue { margin: 0; font-size: 13px; line-height: 1.5; }
  #verdict .cue + .cue { margin-top: 8px; }
  .cue-label {
    display: inline-block; margin-right: 6px; font-size: 10px;
    text-transform: uppercase; letter-spacing: .06em; color: var(--accent);
  }
  .cue.alt .cue-label { color: var(--muted); }
  .cue.alt { color: var(--muted); }

  #next {
    display: block; width: 100%; margin-top: 14px;
    background: var(--accent); color: #17130a; border: 0;
    border-radius: var(--radius); padding: 15px; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  #next:active { filter: brightness(.92); }

  /* ---- panels ---- */
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 14px;
  }
  .legend-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .legend-item:last-child { border-bottom: 0; }
  .legend-item .key {
    flex: none; width: 20px; height: 20px; border-radius: 5px; background: var(--panel-2);
    color: var(--muted); font-size: 11px; display: grid; place-items: center;
  }
  .legend-item strong { display: block; font-size: 14px; font-weight: 600; }
  .legend-cue { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); font-weight: 500; padding-bottom: 6px; }
  td { padding: 7px 0; border-top: 1px solid var(--line); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; width: 62px; }
  td.good { color: var(--ok); } td.mid { color: var(--accent); }
  td.bad { color: var(--no); } td.none { color: var(--muted); }

  #missed { margin-top: 18px; }
  #missed h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
               color: var(--muted); font-weight: 500; margin: 0 0 8px; }
  .miss { padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .miss-q { color: var(--text); }
  .miss-a { margin-top: 4px; font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .miss-a .no { color: var(--no); } .miss-a .ok { color: var(--ok); }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }

  footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 22px; line-height: 1.6; }
  kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
        padding: 1px 5px; font-size: 10px; font-family: inherit; }

  /* ---- phone ---- */
  @media (max-width: 560px) {
    .wrap { padding: 12px 12px 32px; }
    #options { grid-template-columns: 1fr; }
    .opt .key { display: none; }
    #question { font-size: 16px; }
    .stat b { font-size: 16px; }
    .kbdhint { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>LP <span>Mapping</span> Trainer</h1>
    <div class="tools">
      <button class="tool" id="legendToggle">cheat sheet</button>
      <button class="tool" id="statsToggle">stats</button>
    </div>
  </header>

  <div class="score-row">
    <div class="stat"><b id="score">0/0</b><i>score</i></div>
    <div class="stat"><b id="pct">0%</b><i>accuracy</i></div>
    <div class="stat"><b id="streak">0</b><i>streak</i></div>
    <div class="stat"><b id="best">0</b><i>best</i></div>
  </div>

  <div class="panel" id="legend" hidden>
    <div id="legendBody"></div>
  </div>

  <div class="panel" id="statsPanel" hidden>
    <table>
      <thead><tr><th>Leadership Principle</th><th class="num">hits</th><th class="num">acc</th></tr></thead>
      <tbody id="breakdownBody"></tbody>
    </table>
    <div id="missed"></div>
    <button class="tool" id="reset" style="margin-top:14px">reset all stats</button>
  </div>

  <div class="card">
    <div class="meta">
      <span class="badge" id="srcBadge"></span>
      <span>which LP is this?</span>
      <span id="remaining"></span>
    </div>
    <p id="question"></p>
  </div>

  <div id="options"></div>

  <div id="verdict" hidden></div>

  <button id="next" hidden>Next question</button>

  <footer>
    <span class="kbdhint"><kbd>1</kbd>–<kbd>9</kbd> to answer · <kbd>enter</kbd> for next<br></span>
    Amazon Confidential — do not share outside Amazon.
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
